[project]
name = "opspilot"
version = "0.1.0"
description = "AI incident-triage Slack bot with MCP tools"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "slack_bolt>=1.20",
  "aiohttp>=3.9",
  "mcp>=1.2,<2",
  "anthropic>=0.40",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "prometheus_client>=0.20",
  "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.setuptools]
packages = ["app", "app.llm", "mcp_servers", "demo_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
