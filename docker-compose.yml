services:
  demo:
    build: .
    image: opspilot-app
    command: uvicorn demo_service.app:app --host 0.0.0.0 --port 8001
    environment: { LOG_FILE: /logs/demo_service.log }
    volumes: [logs:/logs]
    ports: ["8001:8001"]
  loadgen:
    build: .
    image: opspilot-app
    command: python -m demo_service.loadgen
    environment: { TARGET_URL: "http://demo:8001", RPS: "10" }
    depends_on: [demo]
  opspilot:
    build: .
    image: opspilot-app
    env_file: [{ path: .env, required: false }]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      LOG_FILE: /logs/demo_service.log
      RUNBOOKS_DIR: /srv/runbooks
      DATABASE_URL: sqlite:////data/opspilot.db
    volumes: [logs:/logs:ro, db:/data]
    ports: ["8000:8000"]
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports: ["9090:9090"]
  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes: ["./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["9093:9093"]
  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
volumes:
  logs:
  db:
