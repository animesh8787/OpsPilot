global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alert_rules.yml]
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]
scrape_configs:
  - job_name: checkout
    static_configs: [{ targets: ["demo:8001"], labels: { service: checkout } }]
  - job_name: opspilot
    static_configs: [{ targets: ["opspilot:8000"], labels: { service: opspilot } }]
